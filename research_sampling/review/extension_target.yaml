  scaling: unit mass, temperature one, Fourier transform integral exp(-i*xi*t)
  basis: whiten positions by K^(1/2); retain matrix covariance
  symmetries: simultaneous orthogonal conjugacy; replica permutation; mu sign
matrices:
  spectral_inverse: K*Gamma^(-1)*K + xi^2*(Gamma-K*Gamma^(-1)-Gamma^(-1)*K) + xi^4*Gamma^(-1)
  congruence: Gamma*(Gamma-K*Gamma^(-1)-Gamma^(-1)*K)*Gamma = Gamma^3-Gamma*K-K*Gamma
  lyapunov: H=Gamma^2/2-K; Gamma*H+H*Gamma=C
  shape_threshold: gamma^2 >= lambda_max(G^(-3/2)*(G*K+K*G)*G^(-3/2))
sequences:
  replica_limit: b_(2m)=binomial(2m,m)/4^m; b_odd=0
  baseline_relative_even: 2*b_(2m), beginning 1, 3/4, 5/8
