target_id: kinetic_rotation_matrix_ordering_v1_1
search_date: 2026-11-01
role: independent_ai_review
intended_contribution_unit: theorem_and_bridge
claim:
  exact_statement: >-
    For real symmetric positive definite K and Gamma and invertible real
    skew-symmetric J commuting with each, stationary position asymptotic
    variance in the unit-mass kinetic system with simultaneous -mu*J
    rotations of q and p is nonincreasing in abs(mu) for every L2 observable
    if and only if Gamma^3-Gamma*K-K*Gamma is positive semidefinite.
    Under this condition equality at two distinct nonnegative amplitudes
    holds exactly for rotation-invariant observables. Two identical replicas
    give such an invertible J for every base K and Gamma.
  exclusions:
    - no claim for arbitrary non-Gaussian targets
    - no discretization or wall-clock efficiency theorem
    - no identification with observable-specific optimal friction
    - no novelty claim for replica duplication or Gaussian chaos alone
