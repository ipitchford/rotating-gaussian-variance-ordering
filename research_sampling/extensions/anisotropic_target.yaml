target_id: kinetic-matrix-universal-rotation-ordering
search_date: 2026-11-01
intended_contribution_unit: theorem
claim:
  exact_statement: |
    Let K and Gamma be real symmetric positive definite d by d matrices,
    and J a real skew-symmetric matrix commuting with each. Do not assume
    K Gamma = Gamma K. For the stationary unit-mass process
    dq=(p-mu Jq)dt, dp=(-Kq-Gamma p-mu Jp)dt+sqrt(2Gamma)dW,
    and every real L2 position observable f, put
    V_f(mu)=lim_{T to infinity} T Var[T^{-1} integral_0^T f(q_t)dt].
    The matrix inequality Gamma^3-Gamma K-K Gamma >= 0 implies that
    V_f(mu) is nonincreasing in |mu|, with strict decrease between any
    distinct nonnegative amplitudes exactly when f is not invariant under
    exp(tJ). If J is invertible, this condition is also necessary, even for
    the weaker claim V_f(mu)<=V_f(0) for all linear f and all mu near zero.
    Among all Gamma satisfying this inequality, sqrt(2K) is the unique
    least matrix in Loewner order. Replication makes an invertible commuting
    J available for arbitrary base K and Gamma.
  exclusions:
    - No claim that the standard transfer-function spectrum is new.
    - No priority claim for scalar unimodal convolution or elementary tensor layer-cake.
    - No necessity claim for arbitrary singular J.
    - No novelty claim for the construction of nonreversible replica coupling.
    - No guarantee for non-Gaussian targets, discrete observation, or numerical integration.
    - Least admissible friction refers to universal ordering, not computing-time optimality.
source:
  originating_reference: "Duncan, Nuesken and Pavliotis (2017), Using perturbed underdamped Langevin dynamics to efficiently sample from probability distributions, conjecture following Eq. (27)"
  url: "https://doi.org/10.1007/s10955-017-1906-8"
