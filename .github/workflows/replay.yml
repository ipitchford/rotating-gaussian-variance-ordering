# SPDX-License-Identifier: MIT
name: Replay
on:
  push:
  pull_request:
jobs:
  checks:
    name: Verification scripts (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check MANIFEST.sha256 and the bundle manifest
        run: |
          sha256sum -c MANIFEST.sha256
          (cd research_sampling && sha256sum -c MANIFEST.sha256)
      - name: Install packages
        run: python -m pip install numpy scipy matplotlib sympy
      - name: Run every script on a fresh copy, with and without -O (explicit checks raise on failure)
        env:
          MPLBACKEND: Agg
        run: |
          for mode in plain O; do
            D="$RUNNER_TEMP/rs_$mode"; O="$RUNNER_TEMP/out_$mode"; cp -R research_sampling "$D"; mkdir -p "$O/figures"
            F=""; if [ "$mode" = O ]; then F="-O"; fi
            python -I -B $F "$D/code/verify.py" --symbolic --output "$O/verification_results.json" --figures-dir "$O/figures" > /dev/null
            python -I -B $F "$D/code/verify_matrix_extension.py" --output "$O/matrix_extension_results.json" > /dev/null
            python -I -B $F "$D/code/verify_below_threshold.py" --output "$O/below_threshold_results.json" > /dev/null
          done
      - name: Working tree unchanged
        run: test -z "$(git status --porcelain)"
